<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumen bottom-control regression</title>
    <style>
      body { margin: 24px; font: 14px/1.5 system-ui; color: #e8d9c7; background: #24211e; }
      h1 { font-size: 21px; }
      p { max-width: 65ch; color: #c6ab8d; }
      button { min-height: 44px; padding: 10px 18px; border: 0; border-radius: 24px; background: #e8d9c7; color: #24211e; font: inherit; }
      pre { white-space: pre-wrap; font: 12px/1.7 monospace; }
    </style>
  </head>
  <body>
    <h1>Lumen bottom-control regression</h1>
    <p>Actual People and navigation components, in isolated frames. No Lumen app, storage or service worker is loaded.</p>
    <p>Viewport units, display mode and safe areas are simulated. This tests anchoring and scrolling, not physical iOS painting or keyboard events.</p>
    <button id="run" type="button" disabled>Run control regressions</button>
    <h2 id="status">Not run</h2>
    <pre id="results"></pre>
    <script type="module" src="./mobile-controls.tsx"></script>
  </body>
</html>
