<!doctype html>
<html lang="en" data-lumen-launch="dark" data-lumen-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#24211e" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lumen" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Appearance is a tiny device preference, separate from personal records.
         Resolve it before CSS/modules; denied/corrupt storage defaults to Dark.
         Never change viewport geometry or native Apple status-bar metadata here. -->
    <script id="lumen-theme-bootstrap">
      (function () {
        var theme = 'dark';
        try { if (localStorage.getItem('lumen-appearance-v1') === 'light') theme = 'light'; } catch (_) {}
        var root = document.documentElement;
        root.setAttribute('data-lumen-theme', theme);
        root.setAttribute('data-lumen-launch', theme);
        root.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'light' ? '#f7f3ed' : '#24211e');
      })();
    </script>
    <style id="lumen-launch-theme">
      html[data-lumen-launch="dark"] { background: #24211e; color-scheme: dark; }
      html[data-lumen-launch="dark"] body,
      html[data-lumen-launch="dark"] #root { background: #24211e; }
      html[data-lumen-launch="light"] { background: #f7f3ed; color-scheme: light; }
      html[data-lumen-launch="light"] body,
      html[data-lumen-launch="light"] #root { background: #f7f3ed; }
    </style>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="./lumen-icon-v2-32.png" />
    <link rel="apple-touch-icon" type="image/png" sizes="180x180" href="./lumen-icon-v2-180.png" />
    <title>Lumen · Your personal space</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
