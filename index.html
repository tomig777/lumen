<!doctype html>
<html lang="en" data-lumen-launch="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#24211e" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lumen" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Paint the welcome theme before CSS/modules or device data finish loading.
         React removes this guard after the first real screen is committed;
         existing page-specific themes then take over. Never size the viewport here. -->
    <style id="lumen-launch-theme">
      html[data-lumen-launch="dark"] { background: #24211e; color-scheme: dark; }
      html[data-lumen-launch="dark"] body,
      html[data-lumen-launch="dark"] #root { background: #24211e; }
    </style>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="./lumen-icon-v2-32.png" />
    <link rel="apple-touch-icon" type="image/png" sizes="180x180" href="./lumen-icon-v2-180.png" />
    <title>Lumen · Your personal space</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
